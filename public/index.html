<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Welcome to my portfolio!" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Joseph Sfeir</title>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    #backToTop {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      bottom: 20px; /* 20px from the bottom */
      right: 20px; /* 20px from the right */
      z-index: 99; /* Make sure it does not overlap */
      border: none; /* Remove borders */
      outline: none; /* Remove outline */
      background-color: #333; /* Set background color */
      color: white; /* Text color */
      cursor: pointer; /* Add a mouse pointer on hover */
      padding: 15px; /* Some padding */
      border-radius: 50%; /* Circular shape */
      font-size: 24px; /* Increase font size */
      transition: opacity 0.4s ease-in-out, background-color 0.3s ease-in-out; /* Smooth transition */
      width: 57px;
      opacity: 0; /* Initial state is invisible */
    }

    #backToTop:hover {
      background-color: #555; /* Add a lighter grey background on hover */
    }

    #backToTop.show {
      display: block;
      opacity: 1; /* Visible */
    }

    #backToTop.hide {
      opacity: 0; /* Invisible */
      transition: opacity 0.3s ease; /* Smooth transition */
    }
  </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<!-- Back to Top Button -->
<button id="backToTop" title="Go to top"><i class="fas fa-chevron-up"></i></button>
<div id="splash-root"></div>
<div id="root" class="hidden"></div>

<script>
  // Get the button
  var mybutton = document.getElementById("backToTop");

  // When the user scrolls down 20px from the top of the document, show the button
  window.onscroll = function() {
    scrollFunction();
  };

  function scrollFunction() {
    if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
      mybutton.classList.add('show');
      mybutton.classList.remove('hide');
    } else {
      mybutton.classList.add('hide');
      mybutton.classList.remove('show');
    }
  }

  // When the user clicks on the button, scroll to the top of the document
  mybutton.onclick = function() {
    document.body.scrollTop = 0; // For Safari
    document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
  };
</script>
</body>
</html>
