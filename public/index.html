<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5" />
  <meta name="theme-color" content="#0A0E12" />
  <meta name="description" content="Welcome to my portfolio!" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Joseph Sfeir</title>
  <!-- Rouse Sans Font -->
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/rouse-sans" type="text/css"/>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    #backToTop {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      bottom: 20px; /* 20px from the bottom */
      right: 20px; /* 20px from the right */
      z-index: 99; /* Make sure it does not overlap */
      border: none; /* Remove borders */
      outline: none; /* Remove outline */
      background-color: rgba(21, 28, 36, 0.9);
      border: 1px solid #263341;
      color: #00FF9C;
      cursor: pointer;
      padding: 15px;
      border-radius: 12px;
      font-size: 20px;
      transition: opacity 0.4s ease-in-out, background-color 0.3s ease-in-out,
                  border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      width: 52px;
      height: 52px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; /* Initial state is invisible */
    }

    #backToTop:hover {
      border-color: #00FF9C;
      box-shadow: 0 0 20px rgba(0, 255, 156, 0.3);
    }

    #backToTop.show {
      display: block;
      opacity: 1; /* Visible */
    }

    #backToTop.hide {
      opacity: 0; /* Invisible */
      transition: opacity 0.3s ease; /* Smooth transition */
    }
  </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<!-- Back to Top Button -->
<button id="backToTop" title="Go to top"><i class="fas fa-chevron-up"></i></button>
<div id="splash-root"></div>
<div id="root" class="hidden"></div>

<script>
  // Get the button
  var mybutton = document.getElementById("backToTop");

  // When the user scrolls down 20px from the top of the document, show the button
  window.onscroll = function() {
    scrollFunction();
  };

  function scrollFunction() {
    if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
      mybutton.classList.add('show');
      mybutton.classList.remove('hide');
    } else {
      mybutton.classList.add('hide');
      mybutton.classList.remove('show');
    }
  }

  // When the user clicks on the button, scroll to the top of the document
  mybutton.onclick = function() {
    document.body.scrollTop = 0; // For Safari
    document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
  };
</script>
</body>
</html>
