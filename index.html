  <style>
    #backToTop {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      bottom: 20px; /* 20px from the bottom */
      right: 20px; /* 20px from the right */
      z-index: 99; /* Make sure it does not overlap */
      border: none; /* Remove borders */
      outline: none; /* Remove outline */
      background-color: rgba(21, 28, 36, 0.9);
      border: 1px solid #263341;
      color: #00FF9C;
      cursor: pointer;
      padding: 15px;
      border-radius: 12px;
      font-size: 20px;
      transition: opacity 0.4s ease-in-out, background-color 0.3s ease-in-out,
                  border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      width: 52px;
      height: 52px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; /* Initial state is invisible */
    }

    #backToTop svg {
      display: block;
      margin: 0 auto;
    }

    #backToTop:hover {
      border-color: #00FF9C;
      box-shadow: 0 0 20px rgba(0, 255, 156, 0.3);
    }

    #backToTop.show {
      display: block;
      opacity: 1; /* Visible */
    }

    #backToTop.hide {
      opacity: 0; /* Invisible */
      transition: opacity 0.3s ease; /* Smooth transition */
    }
  </style>
</head>
<body>
<!-- Back to Top Button -->
<button id="backToTop" title="Go to top" aria-label="Back to top">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
</button>
<div id="root"><!--app-html--></div>
<script type="module" src="/src/main.jsx"></script>

<script>
  // Get the button
  var mybutton = document.getElementById("backToTop");

  // When the user scrolls down 20px from the top of the document, show the button
  window.onscroll = function() {
    scrollFunction();
  };

  function scrollFunction() {
    if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
      mybutton.classList.add('show');
      mybutton.classList.remove('hide');
    } else {
      mybutton.classList.add('hide');
      mybutton.classList.remove('show');
    }
  }

  // When the user clicks on the button, scroll to the top of the document
  mybutton.onclick = function() {
    document.body.scrollTop = 0; // For Safari
    document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
  };
</script>
